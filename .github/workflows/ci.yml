name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Middt.Framework.slnx

      - name: Build
        run: dotnet build Middt.Framework.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution Middt.Framework.slnx -c Release --no-build

      - name: Pack framework packages
        run: dotnet pack Middt.Framework.slnx -c Release --no-build -o artifacts -p:VersionSuffix=ci.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  # TypeScript core of the server driven UI: runs the same conformance suite (spec/) as the .NET tests.
  typescript-ui-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/client/typescript/ui-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: npm ci && npm run build

      - name: Test
        run: node --test test/

  # Angular: build the SDK packages (@middt/ui-core, @middt/angular) and the demo app that consumes them.
  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build @middt/ui-core
        working-directory: sdk/client/typescript/ui-core
        run: npm ci && npm run build

      - name: Build @middt/angular
        working-directory: sdk/client/angular
        run: npm ci && npx ng build middt-angular

      - name: Test @middt/angular
        working-directory: sdk/client/angular
        run: npx ng test --watch=false

      - name: Build demo app
        working-directory: demo/client/angular/app
        run: npm ci && npx ng build sample --configuration production

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate disposable stack credentials
        run: |
          echo "IDP_BLAZOR_CLIENT_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "IDP_ANGULAR_CLIENT_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MSSQL_SA_PASSWORD=Aa1!$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "RABBITMQ_DEFAULT_USER=ci-user" >> "$GITHUB_ENV"
          echo "RABBITMQ_DEFAULT_PASS=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - name: Start full stack on SQL Server
        run: docker compose up -d --build
      - name: Install browser tests
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for application health
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/health >/dev/null &&
               curl --fail --silent http://localhost:8081/health >/dev/null &&
               curl --fail --silent http://localhost:8083/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Browser and SQL Server integration tests
        working-directory: tests/e2e
        run: npm test
      - name: Full stack logs on failure
        if: failure()
        run: docker compose logs --tail=150
