name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Middt.Framework.slnx

      - name: Build
        run: dotnet build Middt.Framework.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution Middt.Framework.slnx -c Release --no-build

      - name: Pack framework packages
        run: dotnet pack Middt.Framework.slnx -c Release --no-build -o artifacts -p:VersionSuffix=ci.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
