# Container based alternative to the Aspire AppHost (demo/Middt.Sample.AppHost).
#   docker compose up --build   → Blazor UI: http://localhost:8080   Angular UI: http://localhost:8081
#                                 Identity provider (login, /admin): http://localhost:8083   API docs: http://127.0.0.1:8180/scalar
name: middt-sample

# Secrets have no defaults: copy .env.example to .env (git ignored) and set them, or export them in the shell.
x-sql-password: &sql-password ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD (see .env.example)}
x-blazor-client-secret: &blazor-client-secret ${IDP_BLAZOR_CLIENT_SECRET:?Set IDP_BLAZOR_CLIENT_SECRET (see .env.example)}
x-angular-client-secret: &angular-client-secret ${IDP_ANGULAR_CLIENT_SECRET:?Set IDP_ANGULAR_CLIENT_SECRET (see .env.example)}

services:
  middt-sample-blazorserver:
    build:
      context: .
      dockerfile: demo/client/blazor/Middt.Sample.BlazorServer/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__URL: http://middt-sample-api:8080
      ConnectionStrings__redis: redis:6379
      # Sign-in at the identity provider: browsers are redirected to localhost:8083 (= the issuer), server-to-server
      # calls (discovery, token, revocation) go to the container directly.
      Bff__Oidc__Authority: http://localhost:8083/
      Bff__Oidc__BackchannelAuthority: http://middt-identity:8080/
      Bff__Oidc__ClientId: middt-blazor
      Bff__Oidc__ClientSecret: *blazor-client-secret
    ports:
      - "8080:8080"
    networks:
      backend:
        # Fixed address: the API trusts X-Forwarded-For only from the two BFFs (see ForwardedHeaders__KnownProxies).
        ipv4_address: 172.29.0.250
    depends_on:
      middt-sample-api:
        condition: service_started
      middt-identity:
        condition: service_started
      redis:
        condition: service_healthy

  middt-sample-angular:
    build:
      context: .
      dockerfile: demo/client/angular/Middt.Sample.Angular/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__URL: http://middt-sample-api:8080
      ConnectionStrings__redis: redis:6379
      # Sign-in at the identity provider: browsers are redirected to localhost:8083 (= the issuer), server-to-server
      # calls (discovery, token, revocation) go to the container directly.
      Bff__Oidc__Authority: http://localhost:8083/
      Bff__Oidc__BackchannelAuthority: http://middt-identity:8080/
      Bff__Oidc__ClientId: middt-angular
      Bff__Oidc__ClientSecret: *angular-client-secret
    ports:
      - "8081:8080"
    networks:
      backend:
        ipv4_address: 172.29.0.251
    depends_on:
      middt-sample-api:
        condition: service_started
      middt-identity:
        condition: service_started
      redis:
        condition: service_healthy

  middt-sample-api:
    build:
      context: .
      dockerfile: demo/server/Middt.Sample.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WorkflowDb: "Server=db_server,1433;Database=MiddtWorkflow;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD (see .env.example)};TrustServerCertificate=True"
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__messaging: amqp://${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER (see .env.example)}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS (see .env.example)}@mq:5672
      # Access tokens are issued by the identity provider (audience middt-api); keys come from its discovery document.
      Authentication__Authority: http://localhost:8083/
      Authentication__BackchannelAuthority: http://middt-identity:8080/
      # The BFFs forward the end user's IP (X-Forwarded-For). Trust exactly these two containers, not the whole network:
      # requests through the published port arrive from the docker gateway and must not be able to spoof their IP
      # (the per-IP login rate limiter depends on it).
      ForwardedHeaders__KnownProxies__0: 172.29.0.250
      ForwardedHeaders__KnownProxies__1: 172.29.0.251
    ports:
      # Local tooling only (Scalar, curl); browsers go through the BFFs.
      - "127.0.0.1:8180:8080"
    networks: [backend]
    depends_on:
      db_server:
        condition: service_healthy
      redis:
        condition: service_healthy
      mq:
        condition: service_healthy

  # Middt Identity (identity/Middt.Identity) – the OAuth 2.0 / OpenID Connect server, configured for the demo by
  # demo/server/identity.json (clients, demo users, relaxed password policy); secrets come from .env.
  middt-identity:
    build:
      context: .
      dockerfile: identity/Middt.Identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Identity__ConfigFile: /app/config/identity.json
      ConnectionStrings__Identity: "Server=db_server,1433;Database=MiddtIdentity;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD (see .env.example)};TrustServerCertificate=True"
      ConnectionStrings__redis: redis:6379
      # The public issuer: what browsers, the BFFs (via their backchannel rewrite) and the API all agree on.
      Identity__Issuer: http://localhost:8083/
      # Client secrets of the two BFFs (seed index = order in identity.json: 0 = middt-blazor, 1 = middt-angular).
      # An existing client keeps its secret: change it in /admin/clients or recreate the MiddtIdentity database.
      Identity__Seed__Clients__0__ClientSecret: *blazor-client-secret
      Identity__Seed__Clients__1__ClientSecret: *angular-client-secret
    volumes:
      - ./demo/server/identity.json:/app/config/identity.json:ro
      # Development signing keys (see the Dockerfile): survive container recreation.
      - identity-keys:/home/app/.dotnet/corefx/cryptography/x509stores
    ports:
      - "8083:8080"
    networks: [backend]
    depends_on:
      db_server:
        condition: service_healthy
      redis:
        condition: service_healthy

  mq:
    image: rabbitmq:4-management
    networks: [backend]
    environment:
      # Only applied when the broker's data is created; change both together with .env.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS (see .env.example)}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [backend]
    # Only reachable inside the compose network (avoids clashing with a local Redis on 6379).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  db_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks: [backend]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sql-password
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -h -1 | grep -q 1"]
      interval: 10s
      retries: 30
      start_period: 15s


networks:
  backend:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mssql-data:
  identity-keys:
