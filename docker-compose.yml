# Container based alternative to the Aspire AppHost (Sample/Middt.Sample.AppHost).
#   docker compose up --build   → UI: http://localhost:8080   API docs: http://localhost:8180/scalar
name: middt-sample

x-sql-password: &sql-password ${MSSQL_SA_PASSWORD:-yourStrong(!)Password}

services:
  middt-sample-blazorserver:
    build:
      context: .
      dockerfile: Sample/Middt.Sample.BlazorServer/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiSettings__URL: http://middt-sample-api:8080
      ConnectionStrings__redis: redis:6379
    ports:
      - "8080:8080"
    networks: [backend]
    depends_on:
      middt-sample-api:
        condition: service_started
      redis:
        condition: service_healthy

  middt-sample-api:
    build:
      context: .
      dockerfile: Sample/Middt.Sample.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BikeStores: "Server=db_server,1433;Database=BikeStores;User Id=sa;Password=${MSSQL_SA_PASSWORD:-yourStrong(!)Password};TrustServerCertificate=True"
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__messaging: amqp://guest:guest@mq:5672
      JwtSettings__Secret: ${JWT_SECRET:-development-only-signing-key-change-me-0123456789}
      # The Blazor BFF forwards the end user's IP (X-Forwarded-For); trust only this compose network.
      ForwardedHeaders__KnownNetworks__0: 172.29.0.0/24
    ports:
      - "8180:8080"
    networks: [backend]
    depends_on:
      db_server:
        condition: service_healthy
      redis:
        condition: service_healthy
      mq:
        condition: service_healthy

  mq:
    image: rabbitmq:4-management
    networks: [backend]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [backend]
    # Only reachable inside the compose network (avoids clashing with a local Redis on 6379).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  db_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks: [backend]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sql-password
    volumes:
      - ./data:/scripts:ro
      - mssql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      # Healthy only after the BikeStores seed script has run.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1 FROM sys.databases WHERE name = 'BikeStores'\" -h -1 | grep -q 1"]
      interval: 10s
      retries: 30
      start_period: 20s
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        until /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; do
          echo "Waiting for SQL Server..."; sleep 3
        done
        if ! /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -h -1 -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE name = 'BikeStores'" | grep -q BikeStores; then
          for script in /scripts/*.sql; do
            /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -i "$$script"
          done
        fi
        wait

networks:
  backend:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  mssql-data:
